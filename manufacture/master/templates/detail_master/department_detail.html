{% extends 'base_app/employee.html' %}
{% block title %}{{ title_1 }}{% endblock %}
{% load static %}
{% block content %}
<div class="max-h-screen flex flex-wrap w-screen">
    <div class="w-3/5 flex bg-transparent">
        <div class="w-1/3 justify-start">
            <nav class="border-gray-200 bg-transparent ml-5 my-1">
                <div class=" flex justify-start items-center">
                    <button type="button" onclick="document.getElementById('form-department').submit()" class="float-start gap-1 bg-gray-700 px-3 rounded-sm py-1 hover:bg-gray-600 focus:ring-1 cursor-pointer text-white">
                        Confirm                                         
                    </button>
                </div>
            </nav>
        </div>
    </div>
</div>
<form id="form-department" class="w-3/5 bg-gray-800 py-10 px-8 rounded-md shadow-xl text-gray-900 mx-5 my-1 border-1/2 border-gray-200 resize-y" action="." method="post">
    {% csrf_token %}
    <div class="flex gap-5 items-center my-2">
        <label for="department-id" class="text-gray-400 text-md font-semibold items-center w-1/5">Department Name</label>
        <input type="text" id="department-id" value="{{ department.department }}" name="department" class="w-4/5 border-b-2 text-md font-semibold items-center text-gray-400 bg-transparent focus:outline-none border-gray-400 hover:border-red-600 focus:border-blue-600">
    </div>
    <div class="flex gap-5 items-center mt-5">
        <label for="manager-id" class="text-gray-400 text-md font-semibold items-center w-1/5">Manager</label>
        <select name="manager" id="manager-id" class="w-2/5 justify-start border-b-2 text-md font-semibold items-center text-gray-400 bg-transparent focus:outline-none border-gray-400 hover:border-red-600 focus:border-blue-600">
            <option value="" class="bg-gray-800 text-gray-400 hover:text-white font-semibold" selected>Choose Manager</option>
            {% for data in data.0.user %}
                <option value="{{ data.pk }}" class="bg-gray-800 text-gray-400 hover:text-white font-semibold" {% if data.pk == department.manager.pk %} selected {% endif %} >{{ data.username }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="flex gap-5 items-center mt-5">
        <label for="parent-id" class="text-gray-400 text-md font-semibold items-center w-1/5">Parent Department</label>
        <select name="parent" id="parent-id" class="w-2/5 justify-start border-b-2 text-md font-semibold items-center text-gray-400 bg-transparent focus:outline-none border-gray-400 hover:border-red-600 focus:border-blue-600">
            <option value="" class="bg-gray-800 text-gray-400 hover:text-white font-semibold" selected>Choose Parent</option>
            {% for data in data.0.department %}
            <option value="{{ data.pk }}" class="bg-gray-800 text-gray-400 hover:text-white font-semibold" {% if data.pk == department.parent.pk %} selected {% endif %} >{{ data.department }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="flex gap-5 items-center mt-5">
        <label for="company-id" class="text-gray-400 text-md font-semibold items-center w-1/5">Company</label>
        <select name="company" id="company-id" class="w-2/5 justify-start border-b-2 text-md font-semibold items-center text-gray-400 bg-transparent focus:outline-none border-gray-400 hover:border-red-600 focus:border-blue-600">
            <option value="" class="bg-gray-800 text-gray-400 hover:text-white font-semibold" selected>Choose Company</option>
            {% for data in data.0.company %}
                <option value="{{ data.pk }}" class="bg-gray-800 text-gray-400 hover:text-white font-semibold" {% if data.pk == department.company.pk %} selected {% endif %} >{{ data.entity }}</option>
            {% endfor %}
        </select>
    </div>
</form>
{% endblock %}
