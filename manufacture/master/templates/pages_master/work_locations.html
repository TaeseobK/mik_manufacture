{% extends 'base_app/employee.html' %}
{% block title %}{{ title_1 }}{% endblock %}
{% load static %}
{% block content %}
<section class="flex content-center bg-gradient-to-br from-gray-800 via-gray-900 to-gray-800">
    <div class="relative overflow-hiden">
        <table class="fixed w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
            <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                <tr>
                    <th scope="col" class="px-6 py-3">
                        Location
                    </th>
                    <th scope="col" class="px-6 py-3">
                        Address
                    </th>
                    <th scope="col" class="px-6 py-3">
                        Company
                    </th>
                </tr>
            </thead>
            <tbody id="work-list">
                {% for d in page_obj %}
                    <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 cursor-pointer hover:bg-gray-900 hover:text-white">
                        <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                            <a href="{% url 'master:detail_wl' d.pk %}" class="cursor-pointer hover:text-blue-600 hover:underline">
                                {{ d.locations }}
                            </a>
                        </th>
                        <td scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                            {{ d.address }}
                        </td>
                        <td scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                            {{ d.company.entity }}
                        </td>
                    </td>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
<script>
    $(document).ready(function() {
        $('#search').on('keyup', function() {
            var searchQuery = $(this).val();

            $.ajax({
                url: window.location.href,
                data:{
                    'search' : searchQuery
                },
                dataType: 'html',
                success: function(response) {
                    $('#work-list').html($(response).find('#work-list').html());
                }
            });
        });
    });
</script>
{% endblock %}
