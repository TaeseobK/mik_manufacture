{% extends 'base_app/inventory.html' %}
{% block title %}{{ title_1 }}{% endblock %}
{% load static %}
{% block content %}
<div class="max-h-screen flex flex-wrap w-screen">
    <div class="w-3/5 flex bg-transparent">
        <div class="w-1/3 justify-start">
            <nav class="flex gap-1 border-gray-200 bg-transparent ml-5 my-1">
                <div class=" flex justify-start items-center">
                    <button type="button" onclick="document.getElementById('form-warehouse').submit()" class="float-start gap-1 bg-gray-700 px-3 rounded-sm py-1 hover:bg-gray-600 focus:ring-1 cursor-pointer text-white">
                        Confirm                                         
                    </button>
                </div>
            </nav>
        </div>
    </div>
</div>
<form id="form-warehouse" class="w-3/5 bg-gray-800 py-10 px-8 rounded-md shadow-xl text-gray-900 mx-5 my-1 border-1/2 border-gray-200 resize-y" action="." method="post">
    {% csrf_token %}
    <div class="bg-transparent">
        <div class="relative z-0 w-full mb-5 group flex gap-3">
            <p class="text-gray-400 font-semibold relative py-3.5 w-1/6 text-md">Warehouse Name</p>
            <input type="text" name="warehouse-name" autocomplete="off" id="name-warehouse" class="block py-2.5 px-0 my-1 w-5/6 text-md text-white bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-gray-300 dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer placeholder:text-gray-600" placeholder="eg. Raw Material Warehouse" required />
        </div>
        <div class="relative z-0 w-full mb-5 group flex gap-20 mt-10">
            <div class="z-0 w-full mb-5 flex h-full">
                <input type="text" name="short-name" autocomplete="off" id="name-short" class="block py-2.5 px-0 w-full text-md text-white bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder=" " required />
                <label for="name-short" class="peer-focus font-semibold absolute text-sm text-white dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Short Name</label>
            </div>
            <div class="relative z-0 w-full mb-5">
                <div class="flex gap-5">
                    <label for="company-dropdown" class="text-gray-400 font-semibold py-2.5 w-1/5">Company</label>
                    <select name="company" id="company-dropdown" class="block py-2.6 px-0 w-4/5 text-md text-white bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-gray-400 dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer">
                        <option value="" selected class="bg-gray-700">Select Company</option>
                        {% for entity in entities %}
                            <option value="{{ entity.pk }}" class="bg-gray-700">{{ entity.entity }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="flex gap-5">
                    <label for="address-id" class="text-gray-400 font-semibold mt-5 w-1/5">Address</label>
                    <input name="address" id="address-id" type="text" class="block mt-5 px-0 w-4/5 text-md text-white bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-gray-400 dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer thin-scrollbar placeholder:text-gray-600" placeholder="Lorem Ipsum Dolor Sit Amet"></input>
                </div>
            </div>
        </div>
        <label for="description-id" class="text-gray-400 mb-2 font-semibold mt-20">Notes</label>
        <div class="border-t-2 border-gray-600">
            <textarea name="description" id="description-id" autocomplete="off" class="w-full mt-5 bg-transparent text-gray-400 border-b-2 border-gray-600 focus:outline-none placeholder:text-gray-600 thin-scrollbar focus:border-blue-600" placeholder="Lorem ipsum dolor sit amet"></textarea>
        </div>
    </div>
</form>
{% endblock %}
