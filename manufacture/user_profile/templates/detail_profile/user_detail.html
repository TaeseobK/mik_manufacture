{% extends 'base_app/master.html' %}
{% block title %}{{ title_1 }}{% endblock %}
{% load static %}
{% block content %}
<div class="max-h-screen flex flex-wrap w-screen">
    <div class="w-3/5 flex bg-transparent">
        <div class="w-1/3 justify-start">
            <nav class="border-gray-200 bg-transparent ml-5 my-1">
                <div class=" flex justify-start items-center">
                    <button type="button" onclick="document.getElementById('form-user').submit()" class="float-start gap-1 bg-gray-700 px-3 rounded-sm py-1 hover:bg-gray-600 focus:ring-1 cursor-pointer text-white">
                        Update                                    
                    </button>
                </div>
            </nav>
        </div>
    </div>
</div>
<form id="form-user" class="w-3/5 bg-gray-800 py-10 px-8 rounded-md shadow-xl text-gray-900 mx-5 my-1 border-1/2 border-gray-200 resize-y" action="." method="post">
    {% csrf_token %}
    <div class="bg-transparent p-2">
        <ul class="space-y-5">
            <li class="mt-4">
                <div class="flex items-center justify-start bg-transparent w-full">
                    <label for="username-id" class="w-2/12 text-gray-400 font-semibold text-medium">Username</label>
                    <input type="text" id="username-id" name="username" value="{{ user.username }}" class="w-3/12 bg-transparent border-b border-gray-400 focus:outline-none hover:border-red-600 focus:border-blue-600 text-gray-400 font-semibold text-medium">
                </div>
            </li>
            <li class="mt-4">
                <div class="flex items-center justify-start bg-transparent w-full">
                    <div class="w-full flex items-center">
                        <label for="first-name-id" class="w-4/12 text-gray-400 font-semibold text-medium">First Name</label>
                        <input type="text" name="first-name" id="first-name-id" value="{{ user.first_name }}" class="w-6/12 bg-transparent border-b border-gray-400 focus:outline-none hover:border-red-600 focus:border-blue-600 text-gray-400 font-semibold text-medium">
                    </div>
                    <div class="w-full flex items-center">
                        <label for="last-name-id" class="w-4/12 text-gray-400 font-semibold text-medium">Last Name</label>
                        <input type="text" name="last-name" id="last-name-id" value="{{ user.last_name }}" class="w-6/12 bg-transparent border-b border-gray-400 focus:outline-none hover:border-red-600 focus:border-blue-600 text-gray-400 font-semibold text-medium">
                    </div>
                </div>
            </li>
            <li class="mt-4">
                <div class="flex items-center w-full justify-start bg-transparent">
                    <label for="user-email-id" class="w-2/12 text-gray-400 font-semibold text-medium">Email</label>
                    <input type="text" name="user-email" id="user-email-id" value="{{ user.email }}" class="w-3/12 bg-transparent border-b border-gray-400 focus:outline-none hover:border-red-600 focus:border-blue-600 text-gray-400 font-semibold text-medium">
                </div>
            </li>
            <li class="mt-4">
                <hr class="border-b-1 border-gray-400 w-1/3">
                <p class="mt-4 text-gray-400 font-bold">Status :</p>
                <div class="ml-3 mt-2 space-y-2 items-center w-full justify-start bg-transparent gap-5">
                    <div class="flex gap-3 items-center">
                        <input type="checkbox" id="staff-id" name="staff" value="1" {% if user.is_staff %} checked {% endif %} class="text-gray-400 font-medium cursor-pointer text-medium">
                        <label for="staff-id" class="text-gray-400 font-medium text-medium">Staff</label>
                    </div>
                    <div class="flex gap-3 items-center">
                        <input type="checkbox" id="active-id" name="active" value="1" {% if user.is_active %} checked {% endif %} class="text-gray-400 font-medium cursor-pointer text-medium">
                        <label for="active-id" class="text-gray-400 font-medium text-medium">Active</label>
                    </div>
                </div>
            </li>
            <li class="mt-4">
                <hr class="border-b-1 border-gray-400 w-1/3">
                <p class="mt-5 mb-4 text-gray-400 font-bold text-medium">Access Module :</p>
                <ul class="space-y-2 ml-3">
                    {% for data in groups %}
                        <li class="flex gap-5 mt-2">
                            <input type="checkbox" {% if data in user_groups %} checked {% endif %} name="groups" id="{{ data.id }}-id" value="{{ data.id }}" class="text-gray-400 cursor-pointer text-medium font-medium">
                            <label for="{{ data.id }}-id" class="items-center flex text-gray-400 font-semibold text-medium cursor-pointer">{{ data.name }}</label>
                        </li>
                    {% endfor %}
                </ul>
            </li>
        </ul>
    </div>
</form>
{% endblock %}
